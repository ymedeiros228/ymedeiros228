# Gera o gráfico 3D das contribuições (salvo em profile-3d-contrib/)
name: Gráfico 3D das contribuições

on:
  schedule:
    - cron: "30 */12 * * *"  # atualiza a cada 12 horas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # só este job grava o SVG no repositório
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Salvar o gráfico
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git commit -m "Atualiza gráfico 3D das contribuições" || echo "Sem mudanças"
          git push
