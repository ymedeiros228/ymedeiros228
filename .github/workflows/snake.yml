# Gera a animação da cobrinha comendo o gráfico de contribuições
name: Cobrinha das contribuições

on:
  schedule:
    - cron: "0 */12 * * *"   # atualiza a cada 12 horas
  workflow_dispatch:          # permite rodar na mão
  push:
    branches: [main]

permissions:
  contents: read             # padrão: só leitura

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # só este job publica na branch "output"
    steps:
      # Actions de terceiros fixadas num commit exato (a tag fica no comentário)
      - uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
